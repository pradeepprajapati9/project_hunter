name: Hunt leads and publish dashboard

on:
  schedule:
    - cron: "0 1,7,13,19 * * *"   # UTC — roughly 6:30am, 12:30pm, 6:30pm, 12:30am IST
  workflow_dispatch:              # Actions tab se manually bhi chala sakte ho

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Dedupe memory + pichhle run ke leads wapas lao
      - name: Restore data from cache
        uses: actions/cache@v4
        with:
          path: data
          key: hunter-data-${{ github.run_id }}
          restore-keys: hunter-data-

      - name: Run scraper
        run: python hunter.py

      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          mkdir -p _site/data
          cp data/leads.public.json _site/data/leads.json
          echo "Published $(python -c "import json;print(json.load(open('_site/data/leads.json'))['total'])") leads"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
